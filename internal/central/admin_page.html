<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentPal 中心节点管理</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef2f6; color: #172033; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1080px; margin: auto; padding: 32px 20px 60px; }
  h1, h2, h3 { margin: 0; }
  h2 { font-size: 18px; }
  h3 { font-size: 15px; margin-top: 20px; }
  .muted { color: #667385; }
  .hidden { display: none !important; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .brand { font-size: 22px; font-weight: 800; }
  .card { background: #fff; border: 1px solid #d9e0e8; border-radius: 10px; padding: 18px; }
  .card + .card { margin-top: 16px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .notice { border-radius: 8px; padding: 12px 14px; margin: 12px 0; background: #eef4ff; color: #1c3d70; }
  .notice.error { background: #ffe8e8; color: #8a1f1f; }
  .notice.warn { background: #fff4d8; color: #7a5b12; }
  .notice.success { background: #e7f6ec; color: #1c6b3a; }
  label { display: block; margin: 10px 0; color: #44506a; font-size: 14px; }
  input, select { width: 100%; padding: 9px; border: 1px solid #cdd6e0; border-radius: 7px; font: inherit; margin-top: 4px; background: #fff; }
  button { cursor: pointer; border: 1px solid #cdd6e0; background: #f6f8fb; border-radius: 7px; padding: 9px 14px; font: inherit; }
  button:hover { background: #eef2f7; }
  button.primary { background: #172033; color: #fff; border-color: #172033; }
  button.primary:hover { background: #23304a; }
  button.danger { color: #a32424; border-color: #e3c4c4; background: #fff6f6; }
  button:disabled { opacity: .6; cursor: default; }
  .button-row { display: flex; gap: 8px; margin-top: 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid #d9e0e8; }
  .tab { border: none; background: none; border-radius: 0; padding: 10px 14px; color: #667385; border-bottom: 2px solid transparent; }
  .tab.active { color: #172033; font-weight: 600; border-bottom-color: #172033; }
  .tab.right { margin-left: auto; color: #a32424; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .metric strong { display: block; font-size: 22px; margin-top: 4px; }
  table.table { width: 100%; border-collapse: collapse; }
  table.table th, table.table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e6ebf1; }
  table.table th { color: #667385; font-weight: 600; font-size: 13px; }
  table.table td { font-size: 14px; }
  .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .login-card { max-width: 460px; margin: 40px auto; text-align: center; }
  .login-card button { margin-top: 12px; }
  .dialog-backdrop { position: fixed; inset: 0; background: rgba(16,24,40,.45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
  .dialog { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 520px; box-shadow: 0 20px 50px rgba(16,24,40,.25); }
  .dialog .card-head { margin-bottom: 6px; }
  .icon-button { border: none; background: none; font-size: 20px; line-height: 1; padding: 4px 8px; color: #667385; }
  .icon-button:hover { background: #eef2f7; }
  @media (max-width: 760px) { .grid, .row { grid-template-columns: 1fr; } .header { flex-direction: column; align-items: flex-start; gap: 8px; } }
</style>
</head>
<body>
<main>
  <div class="header">
    <div><div class="brand">AgentPal</div><div class="muted">中心节点管理</div></div>
    <div id="session" class="muted"></div>
  </div>

  <section id="loginView" class="card login-card">
    <h2>管理员登录</h2>
    <p class="muted">使用 Casdoor 账号登录，与客户端共用同一登录流程。只有被授权为管理员的账号可以进入管理后台。</p>
    <div id="loginMessage" class="notice error hidden"></div>
    <button class="primary" id="loginButton">使用 Casdoor 登录</button>
  </section>

  <section id="appView" class="hidden">
    <nav class="tabs">
      <button id="tabOverview" class="tab active">概览</button>
      <button id="tabProfiles" class="tab">Auth Profiles</button>
      <button id="tabSettings" class="tab">系统配置</button>
      <button id="logoutButton" class="tab right">退出登录</button>
    </nav>

    <div id="overviewPanel">
      <div id="content"><div class="notice">加载节点状态...</div></div>
    </div>

    <div id="profilesPanel" class="hidden">
      <div class="card">
        <div class="card-head">
          <h2>所有预留 Auth Profile</h2>
          <div class="button-row" style="margin:0">
            <button id="refreshProfiles">刷新</button>
            <button class="primary" id="openCreate">新增 / 覆盖</button>
          </div>
        </div>
        <div id="profileTable"></div>
        <div id="profileMessage"></div>
      </div>
    </div>

    <div id="createDialog" class="dialog-backdrop hidden">
      <div class="dialog">
        <div class="card-head">
          <h3>新增 / 覆盖预留 profile</h3>
          <button class="icon-button" id="closeCreate" aria-label="关闭">×</button>
        </div>
        <p class="muted" id="providerHint">统一 provider：-</p>
        <p class="muted">选择关联用户并录入 API Key，其余内容（provider、base_url、wire_api、类型 api_key）由系统配置预填。</p>
        <div class="row">
          <label id="userSelectLabel">Casdoor 用户 <select id="userSelect"></select></label>
          <label id="userManualLabel" class="hidden">用户 sub（Casdoor 用户 ID） <input id="userManual" placeholder="user id"></label>
        </div>
        <div id="userHint"></div>
        <label>API Key <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off"></label>
        <div class="button-row"><button class="secondary" id="cancelCreate">取消</button><button class="primary" id="applyApiKey">保存并确认</button></div>
        <div id="createMessage"></div>
      </div>
    </div>

    <div id="settingsPanel" class="hidden">
      <div class="card">
        <div class="card-head"><h2>统一 provider 配置</h2></div>
        <p class="muted">这些参数用于生成所有用户的预留 profile。管理员在「Auth Profiles」页只需录入 API Key。</p>
        <div class="row">
          <label>Provider 名称 <input id="sProvider" placeholder="memory"></label>
          <label>wire_api <input id="sWireAPI" placeholder="responses"></label>
        </div>
        <label>Base URL <input id="sBaseURL" placeholder="https://memory.yprenewables.com/codex/default"></label>
        <label>env_key <input id="sEnvKey" placeholder="OPENAI_API_KEY"></label>
        <div class="button-row"><button class="primary" id="saveSettings">保存配置</button></div>
        <div id="settingsMessage"></div>
      </div>
    </div>
  </section>
</main>

<script>
const TOKEN_KEY = 'agentpal-admin-token';
const LOGIN_ID_KEY = 'agentpal-login-id';
const LOGIN_POLL_KEY = 'agentpal-login-poll';
const state = { token: '', subject: '', profiles: [], casdoorUsers: [], casdoorLoaded: false, settings: null };

function $(id) { return document.getElementById(id); }
function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }
function make(tag, text, className) { const n = document.createElement(tag); if (text !== undefined) { n.textContent = text; } if (className) { n.className = className; } return n; }
function authHeaders() { return state.token ? { 'Authorization': 'Bearer ' + state.token } : {}; }

function notice(id, text, kind) {
  const el = $(id);
  if (!text) { el.className = 'notice hidden'; el.textContent = ''; return; }
  el.className = 'notice' + (kind ? ' ' + kind : '');
  el.textContent = text;
}

function requestError(response, text) {
  const error = new Error(text || String(response.status));
  error.status = response.status;
  return error;
}

async function request(method, url, body) {
  const options = { method: method, headers: Object.assign({}, authHeaders()) };
  if (body !== undefined) { options.headers['Content-Type'] = 'application/json'; options.body = JSON.stringify(body); }
  const response = await fetch(url, options);
  if (response.status === 204) { return null; }
  const text = await response.text();
  if (!response.ok) { throw requestError(response, text); }
  return text ? JSON.parse(text) : null;
}

function handleAdminError(error) {
  if (error && error.status === 401) {
    state.token = '';
    sessionStorage.removeItem(TOKEN_KEY);
    showLogin('登录已过期，请重新登录。');
    return '';
  }
  return error && error.message ? error.message : String(error);
}

function showLogin(message) {
  $('appView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  $('session').textContent = '';
  notice('loginMessage', message || '', 'error');
}

function showApp() {
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('session').textContent = state.subject ? ('已登录：' + state.subject) : '';
  closeCreate();
  loadStatus();
  loadSettings();
  switchTab('overview');
}

async function loadMe() {
  const me = await request('GET', '/v1/admin/me');
  state.subject = me.subject;
  return true;
}

async function bootstrap() {
  const loginId = sessionStorage.getItem(LOGIN_ID_KEY);
  const pollToken = sessionStorage.getItem(LOGIN_POLL_KEY);
  if (loginId && pollToken) {
    sessionStorage.removeItem(LOGIN_ID_KEY);
    sessionStorage.removeItem(LOGIN_POLL_KEY);
    try {
      const status = await pollLogin(loginId, pollToken);
      if (status.status === 'approved' && status.accessToken) {
        state.token = status.accessToken;
        sessionStorage.setItem(TOKEN_KEY, status.accessToken);
      } else if (status.status === 'failed') {
        showLogin('登录失败：' + (status.error || '未知错误'));
        return;
      }
    } catch (error) {
      showLogin('登录未完成，请重试。');
      return;
    }
  }
  if (!state.token) { state.token = sessionStorage.getItem(TOKEN_KEY) || ''; }
  if (!state.token) { showLogin(); return; }
  try {
    await loadMe();
    showApp();
  } catch (error) {
    state.token = '';
    sessionStorage.removeItem(TOKEN_KEY);
    showLogin(error.status === 403 ? '该账号没有管理权限。' : '登录已过期，请重新登录。');
  }
}

async function pollLogin(loginId, pollToken) {
  const response = await fetch('/v1/auth/login/status/' + encodeURIComponent(loginId) + '?pollToken=' + encodeURIComponent(pollToken));
  const text = await response.text();
  if (!response.ok) { throw requestError(response, text); }
  return JSON.parse(text);
}

async function login() {
  const button = $('loginButton');
  button.disabled = true;
  button.textContent = '正在跳转 Casdoor...';
  notice('loginMessage', '', 'error');
  try {
    const response = await fetch('/v1/auth/login/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnTo: '/agentpal' }) });
    const text = await response.text();
    if (!response.ok) { throw new Error(text || String(response.status)); }
    const info = JSON.parse(text);
    sessionStorage.setItem(LOGIN_ID_KEY, info.loginId);
    sessionStorage.setItem(LOGIN_POLL_KEY, info.pollToken);
    window.location = info.authorizeUrl;
  } catch (error) {
    button.disabled = false;
    button.textContent = '使用 Casdoor 登录';
    notice('loginMessage', '无法发起登录：' + (error.message || error), 'error');
  }
}

function logout() {
  state.token = '';
  state.subject = '';
  state.profiles = [];
  state.casdoorUsers = [];
  state.casdoorLoaded = false;
  state.settings = null;
  sessionStorage.removeItem(TOKEN_KEY);
  showLogin('已退出登录。');
}

function switchTab(tab) {
  $('tabOverview').classList.toggle('active', tab === 'overview');
  $('tabProfiles').classList.toggle('active', tab === 'profiles');
  $('tabSettings').classList.toggle('active', tab === 'settings');
  $('overviewPanel').classList.toggle('hidden', tab !== 'overview');
  $('profilesPanel').classList.toggle('hidden', tab !== 'profiles');
  $('settingsPanel').classList.toggle('hidden', tab !== 'settings');
  if (tab === 'profiles') {
    loadProfiles();
    renderUserOptions();
    if (!state.casdoorLoaded) { loadCasdoorUsers(); }
  } else {
    closeCreate();
  }
  if (tab === 'settings') { loadSettings(); }
}

async function loadStatus() {
  try {
    const status = await fetch('/v1/admin/status', { credentials: 'include' }).then(function (response) { return response.json(); });
    const content = $('content');
    clear(content);
    const grid = make('div', undefined, 'grid');
    [['Skills', status.skills], ['MCP 服务', status.mcp], ['监听端口', status.port]].forEach(function (pair) {
      const card = make('div', undefined, 'card metric');
      card.appendChild(make('span', pair[0], 'muted'));
      card.appendChild(make('strong', String(pair[1])));
      grid.appendChild(card);
    });
    content.appendChild(grid);
    const info = make('div', undefined, 'card');
    info.appendChild(make('span', '发布目录', 'muted'));
    info.appendChild(make('p', status.codexDir));
    info.appendChild(make('span', '最近扫描', 'muted'));
    info.appendChild(make('p', new Date(status.generatedAt).toLocaleString()));
    content.appendChild(info);
    if (status.scanErrors && status.scanErrors.length) {
      const err = make('div', undefined, 'notice error');
      err.appendChild(make('strong', '扫描错误'));
      status.scanErrors.forEach(function (item) { err.appendChild(make('p', item.path + ': ' + item.error)); });
      content.appendChild(err);
    }
  } catch (error) {
    const content = $('content');
    clear(content);
    content.appendChild(make('div', '节点状态不可用。', 'notice error'));
  }
}

function updateProviderHint() {
  const settings = state.settings || {};
  $('providerHint').textContent = '统一 provider：' + (settings.provider || '-') + '，base_url：' + (settings.baseURL || '-') + '，类型：api_key';
}

async function loadSettings() {
  notice('settingsMessage', '', '');
  try {
    state.settings = await request('GET', '/v1/admin/settings');
    $('sProvider').value = state.settings.provider || '';
    $('sBaseURL').value = state.settings.baseURL || '';
    $('sWireAPI').value = state.settings.wireAPI || '';
    $('sEnvKey').value = state.settings.envKey || '';
    updateProviderHint();
  } catch (error) {
    const handled = handleAdminError(error);
    if (handled) { notice('settingsMessage', handled, 'error'); }
  }
}

async function saveSettings() {
  notice('settingsMessage', '', '');
  const body = { provider: $('sProvider').value.trim(), baseURL: $('sBaseURL').value.trim(), wireAPI: $('sWireAPI').value.trim(), envKey: $('sEnvKey').value.trim() };
  try {
    state.settings = await request('PUT', '/v1/admin/settings', body);
    updateProviderHint();
    notice('settingsMessage', '已保存系统配置。', 'success');
  } catch (error) {
    const handled = handleAdminError(error);
    if (handled) { notice('settingsMessage', handled, 'error'); }
  }
}

async function loadProfiles() {
  try {
    state.profiles = await request('GET', '/v1/admin/profiles');
    renderProfilesTable();
  } catch (error) {
    const handled = handleAdminError(error);
    if (handled) { notice('profileMessage', handled, 'error'); }
  }
}

function renderProfilesTable() {
  const host = $('profileTable');
  clear(host);
  if (!state.profiles.length) { host.appendChild(make('div', '还没有任何预留 profile。', 'muted')); return; }
  const table = make('table', undefined, 'table');
  const thead = make('thead');
  const headRow = make('tr');
  ['用户 (sub)', '名称', 'provider', '类型', '更新时间', ''].forEach(function (h) { headRow.appendChild(make('th', h)); });
  thead.appendChild(headRow);
  table.appendChild(thead);
  const tbody = make('tbody');
  state.profiles.forEach(function (item) {
    const row = make('tr');
    row.appendChild(make('td', item.sub));
    row.appendChild(make('td', item.name));
    row.appendChild(make('td', item.provider));
    row.appendChild(make('td', item.type));
    row.appendChild(make('td', item.updatedAt ? new Date(item.updatedAt).toLocaleString() : '-'));
    const actions = make('td');
    const del = make('button', '删除', 'danger');
    del.onclick = function () { deleteProfile(item.sub, item.name); };
    actions.appendChild(del);
    row.appendChild(actions);
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  host.appendChild(table);
}

async function loadCasdoorUsers() {
  notice('userHint', '', '');
  try {
    state.casdoorUsers = await request('GET', '/v1/admin/casdoor-users');
    state.casdoorLoaded = true;
  } catch (error) {
    state.casdoorUsers = [];
    state.casdoorLoaded = false;
    const handled = handleAdminError(error);
    if (handled) { notice('userHint', handled + '，可手动输入 sub。', 'warn'); }
  }
  renderUserOptions();
}

function renderUserOptions() {
  const select = $('userSelect');
  clear(select);
  if (state.casdoorUsers.length) {
    $('userSelectLabel').classList.remove('hidden');
    $('userManualLabel').classList.add('hidden');
    state.casdoorUsers.forEach(function (user) {
      const option = document.createElement('option');
      option.value = user.sub;
      const label = (user.displayName || user.name || user.sub) + ' · ' + (user.name || '') + (user.email ? ' · ' + user.email : '');
      option.textContent = label;
      select.appendChild(option);
    });
  } else {
    $('userSelectLabel').classList.add('hidden');
    $('userManualLabel').classList.remove('hidden');
  }
}

function selectedSub() {
  if (state.casdoorUsers.length) { return $('userSelect').value; }
  return $('userManual').value.trim();
}

async function applyApiKey() {
  notice('createMessage', '', '');
  const sub = selectedSub();
  const apiKey = $('apiKey').value.trim();
  if (!sub) { notice('createMessage', '请选择或填写关联用户。', 'warn'); return; }
  if (!apiKey) { notice('createMessage', '请输入 API Key。', 'warn'); return; }
  try {
    await request('POST', '/v1/admin/user-profiles/' + encodeURIComponent(sub), { apiKey: apiKey });
    $('apiKey').value = '';
    closeCreate();
    notice('profileMessage', '已为 ' + sub + ' 保存预留 profile。', 'success');
    await loadProfiles();
  } catch (error) {
    const handled = handleAdminError(error);
    if (handled) { notice('createMessage', handled, 'error'); }
  }
}

function openCreate() {
  notice('createMessage', '', '');
  $('createDialog').classList.remove('hidden');
  updateProviderHint();
  renderUserOptions();
  if (!state.casdoorLoaded) { loadCasdoorUsers(); }
}

function closeCreate() {
  $('createDialog').classList.add('hidden');
  notice('createMessage', '', '');
}

async function deleteProfile(sub, name) {
  if (!sub || !name) { notice('profileMessage', '缺少用户或 profile 名称。', 'warn'); return; }
  if (!window.confirm('删除用户 ' + sub + ' 的预留 profile ' + name + '？')) { return; }
  try {
    await request('DELETE', '/v1/admin/user-profiles/' + encodeURIComponent(sub) + '/' + encodeURIComponent(name));
    notice('profileMessage', '已删除 ' + name + '。', 'success');
    await loadProfiles();
  } catch (error) {
    const handled = handleAdminError(error);
    if (handled) { notice('profileMessage', handled, 'error'); }
  }
}

$('loginButton').onclick = login;
$('logoutButton').onclick = logout;
$('tabOverview').onclick = function () { switchTab('overview'); };
$('tabProfiles').onclick = function () { switchTab('profiles'); };
$('tabSettings').onclick = function () { switchTab('settings'); };
$('refreshProfiles').onclick = loadProfiles;
$('openCreate').onclick = openCreate;
$('closeCreate').onclick = closeCreate;
$('cancelCreate').onclick = closeCreate;
$('applyApiKey').onclick = applyApiKey;
$('saveSettings').onclick = saveSettings;
$('createDialog').addEventListener('click', function (event) { if (event.target === $('createDialog')) { closeCreate(); } });
document.addEventListener('keydown', function (event) { if (event.key === 'Escape') { closeCreate(); } });

bootstrap();
</script>
</body>
</html>
